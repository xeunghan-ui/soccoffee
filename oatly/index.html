<!DOCTYPE html>
<!-- 오틀리 풋살 챔피언십 — 아카이브 허브 (회차 목록 + 현재 참가 신청). 회차 페이지는 /oatly/<연도>_<회차>/, 신청은 /oatly/signup/ 고정 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오틀리 풋살 챔피언십 — 아카이브</title>
<meta name="description" content="오틀리 × 싸커피 풋살 챔피언십 아카이브. 역대 대회 기록과 참가 신청.">
<meta property="og:type" content="website">
<meta property="og:title" content="오틀리 풋살 챔피언십 — 아카이브">
<meta property="og:description" content="오틀리 × 싸커피 · 역대 대회 기록과 참가 신청">
<meta property="og:url" content="https://soccoffee.co.kr/oatly/">
<meta property="og:image" content="https://soccoffee.co.kr/poster.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  @font-face {
    font-family: 'WildGag';
    src: url('../wildgag.woff2') format('woff2'), url('../wildgag.ttf') format('truetype');
    font-weight: 700; font-display: swap;
  }
  :root { --paper: #e8e8e6; --card: #ffffff; --ink: #141414; --ink2: #44443f; --muted: #8a8a86; --hard: 4px 4px 0 var(--ink); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 34px 18px 80px; }
  .back { display: inline-block; margin-bottom: 22px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 700; }
  .head { text-align: center; margin-bottom: 28px; }
  .head .kicker { font-size: 12px; font-weight: 800; letter-spacing: .16em; }
  .head .title { font-family: 'WildGag', 'Pretendard', sans-serif; font-size: clamp(30px, 8vw, 46px); line-height: 1.02; margin: 8px 0 4px; }
  .head .sub { font-size: 14px; color: var(--ink2); font-weight: 600; }
  .cards { display: flex; flex-direction: column; gap: 14px; }
  .ed-card { display: block; text-decoration: none; color: var(--ink); background: var(--card); border: 3px solid var(--ink); border-radius: 14px; box-shadow: var(--hard); padding: 20px; transition: transform .05s; }
  .ed-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .ed-card .no { font-family: 'WildGag', 'Pretendard', sans-serif; font-size: 24px; }
  .ed-card .no .yr { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 6px; }
  .ed-card .st { font-size: 13px; font-weight: 700; color: var(--ink2); margin-top: 4px; }
  .ed-card .go { float: right; font-size: 13px; font-weight: 800; }
  .ed-card.live { background: var(--ink); color: var(--card); }
  .ed-card.live .no .yr, .ed-card.live .st { color: #cfcfca; }
  .ed-card.live .badge { display: inline-block; font-size: 11px; font-weight: 800; background: var(--card); color: var(--ink); border-radius: 5px; padding: 1px 7px; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 싸커피 소개</a>

  <div class="head">
    <div class="kicker">OATLY × SOCCOFFEE</div>
    <div class="title">OATLY FUTSAL<br>CHAMPIONSHIP</div>
    <div class="sub">역대 대회 기록 · 참가 신청</div>
  </div>

  <div class="cards">
    <a class="ed-card live" href="signup/">
      <span class="go">참가 신청 →</span>
      <div class="no">제2회<span class="yr">2026</span><span class="badge">신청 접수 중</span></div>
      <div class="st">2026.10.19 (월) 16:30 · 토모 풋살피치</div>
    </a>
    <a class="ed-card" href="2026_1st/">
      <span class="go">기록 보기 →</span>
      <div class="no">제1회<span class="yr">2026</span></div>
      <div class="st">일정 · 경기 결과 · 규칙</div>
    </a>
  </div>
</div>
</body>
</html>
